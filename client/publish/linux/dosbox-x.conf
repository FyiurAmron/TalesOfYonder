# DOSBox-X profile for the seam server on Linux: runs the instrumented
# SWREG.EXE.  The link is the folder next to the game: the engine writes
# OUTPUT.BIN and reads INPUT.BIN, and run-client.sh follows them.
#
# start-server.sh cds into this folder first, because the profile mounts the
# relative "game" directory.  There is no serial port: the folder link needs
# none.

[sdl]
output            = surface
fullscreen        = false
windowresolution  = original
autolock          = false

[dosbox]
machine           = svga_s3
memsize           = 16
captures          = capture
# never ask for a working directory: this folder is the one we want
working directory option = noprompt
quit warning      = false

[cpu]
core              = normal
cputype           = 486
cycles            = fixed 30000

[mixer]
# The client is the sound output now: it synthesises the OPL writes the
# seam streams.  Keep the emulated mixer silent so the host does not play a
# second, slightly delayed copy.  nosound still runs the SB/OPL emulation
# (the game and the driver need it), it only stops the host output.
nosound           = true
rate              = 48000

[sblaster]
sbtype            = sb16
sbbase            = 220
irq               = 7
dma               = 1
hdma              = 5
oplmode           = auto

[dos]
xms               = true
# the game requires EMMXXXX0
ems               = true
umb               = true

[serial]

[autoexec]
@echo off
SET BLASTER=A220 I7 D1 H5 T6
SET SOUND=
mount c game
c:
CH2.BAT
