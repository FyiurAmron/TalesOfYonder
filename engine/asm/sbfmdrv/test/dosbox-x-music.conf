# Real-block profile: install SBFMDRV.COM, then play the CTMF block extracted
# from WORLD.DAT (MUSIC.BLK) through the resident driver with MUSIC.COM.
# Used by engine/asm/sbfmdrv/test/run.sh music; the log is MUSIC.LOG.

[sdl]
output            = surface
fullscreen        = false
windowresolution  = original
autolock          = false

[log]
logfile           = run.log

[dosbox]
machine           = svga_s3
memsize           = 16
captures          = capture
saveremark        = false

[cpu]
core              = normal
cputype           = 486
cycles            = fixed 30000

[mixer]
nosound           = false
rate              = 48000

[sblaster]
sbtype            = sb16
sbbase            = 220
irq               = 7
dma               = 1
hdma              = 5
oplmode           = auto

[dos]
xms               = true
ems               = true
umb               = true

[autoexec]
@echo off
SET BLASTER=A220 I7 D1 H5 T6
mount c .
c:
SBFMDRV.COM
MUSIC.COM
exit
