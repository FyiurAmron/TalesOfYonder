# Uninstall test profile: install SBFMDRV.COM, remove it with /U, then verify
# with TEST.COM (which must report "NO DRIVER").  See engine/asm/sbfmdrv/test/run.sh.

[sdl]
output            = surface
fullscreen        = false
windowresolution  = original
autolock          = false

[log]
logfile           = run.log

[dosbox]
machine           = svga_s3
memsize           = 16
captures          = capture
saveremark        = false

[cpu]
core              = normal
cputype           = 486
cycles            = fixed 30000

[mixer]
nosound           = false
rate              = 48000

[sblaster]
sbtype            = sb16
sbbase            = 220
irq               = 7
dma               = 1
hdma              = 5
oplmode           = auto

[dos]
xms               = true
ems               = true
umb               = true

[autoexec]
@echo off
SET BLASTER=A220 I7 D1 H5 T6
mount c .
c:
SBFMDRV.COM
SBFMDRV.COM /U
TEST.COM
exit
