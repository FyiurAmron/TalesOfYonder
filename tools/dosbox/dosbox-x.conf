# Oracle profile: Yendorian Tales Book I, Chapter 2 (SWREG.EXE, 1996) under DOSBox-X.
# Used by tools/dosbox/baseline.sh, which runs it from the output directory: the relative
# paths below (run.log, capture, game) resolve inside that directory.
# Unlisted options keep DOSBox-X defaults.

[sdl]
# Xvfb has no GL; skip the OpenGL attempt
output            = surface
fullscreen        = false
windowresolution  = original
autolock          = false

[log]
# log file, relative to the run directory
logfile           = run.log

[dosbox]
# VBE 1.2, incl. mode 101h (640x480x8)
machine           = svga_s3
memsize           = 16
# DOSBox-X's own screenshot dir (F12+P is unused: it aborts on the game's VESA
# mode in this version; tools/dosbox/snap.py grabs the X window instead)
captures          = capture
# save state every 15 s into slots 1..4 (rotating)
autosave          = 15 1-4
# never prompt for a remark (automation)
saveremark        = false
saveslot          = 1

[cpu]
core              = normal
cputype           = 486
# cycles are instructions/ms, not MHz: 3,000 is about a 286 at 20-25 MHz
# (DOSBox-X's default, and the speed the game's pacing was made for);
# 30,000 is a 486DX2-66/DX4-100 class and collapses the gate star.
# deterministic, not host-speed dependent
cycles            = fixed 3000

[mixer]
nosound           = false
rate              = 48000

[sblaster]
sbtype            = sb16
sbbase            = 220
irq               = 7
dma               = 1
hdma              = 5
# SB16 -> OPL3
oplmode           = auto

[dos]
xms               = true
# the game requires EMMXXXX0
ems               = true
umb               = true

[autoexec]
@echo off
SET BLASTER=A220 I7 D1 H5 T6
SET SOUND=
mount c game
c:
CH2.BAT
